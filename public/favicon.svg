<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="palmG" x1="8" y1="8" x2="24" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4a0ab"/>
      <stop offset="100%" stop-color="#a85c6e"/>
    </linearGradient>
    <linearGradient id="nailG" x1="8" y1="4" x2="24" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd6e0"/>
      <stop offset="100%" stop-color="#ff8fa3"/>
    </linearGradient>
  </defs>
  <!-- Palm -->
  <ellipse cx="16" cy="20" rx="8" ry="7" fill="url(#palmG)"/>
  <!-- Fingers -->
  <ellipse cx="9"  cy="13" rx="3.2" ry="4.5" fill="url(#palmG)" transform="rotate(-15 9 13)"/>
  <ellipse cx="13.5" cy="10.5" rx="3" ry="4.8" fill="url(#palmG)" transform="rotate(-5 13.5 10.5)"/>
  <ellipse cx="18.5" cy="10.5" rx="3" ry="4.8" fill="url(#palmG)" transform="rotate(5 18.5 10.5)"/>
  <ellipse cx="23" cy="13" rx="3.2" ry="4.5" fill="url(#palmG)" transform="rotate(15 23 13)"/>
  <!-- Nail tips -->
  <ellipse cx="9"  cy="9.2" rx="2" ry="2.5" fill="url(#nailG)" transform="rotate(-15 9 9.2)"/>
  <ellipse cx="13.5" cy="6.5" rx="1.9" ry="2.5" fill="url(#nailG)" transform="rotate(-5 13.5 6.5)"/>
  <ellipse cx="18.5" cy="6.5" rx="1.9" ry="2.5" fill="url(#nailG)" transform="rotate(5 18.5 6.5)"/>
  <ellipse cx="23" cy="9.2" rx="2" ry="2.5" fill="url(#nailG)" transform="rotate(15 23 9.2)"/>
  <!-- Sparkles -->
  <circle cx="26" cy="6" r="1.2" fill="#c9a96e" opacity="0.9"/>
  <circle cx="6"  cy="7" r="0.8" fill="#c9a96e" opacity="0.7"/>
</svg>